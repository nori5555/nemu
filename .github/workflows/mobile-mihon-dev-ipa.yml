name: Mobile Mihon dev IPA

# Unsigned, side-loadable iOS build of the Mihon-source-browser branch.
# Manual only: run it from the branch that has the feature, download the
# artifact, and sign it with SideStore / Esign / Sideloadly. No certificates
# live in CI, and nothing here goes to the App Store.
#
# Bundle id is pm.nemu.mihon.dev on purpose: it installs next to the App
# Store build (pm.nemu) instead of replacing it. The override happens only
# in this job's checkout (app.json is patched before prebuild); the repo
# keeps pm.nemu. Back up or remove the old app first if you ever switch the
# id back: Convex login and Keychain data do not migrate across bundle ids.

permissions:
  contents: read

env:
  # The release bundle here only checks that the app builds; it never ships,
  # and CI has no production Convex URL (see apps/mobile/preflightRelease.cjs).
  NEMU_CI_LOCAL_ONLY_BUNDLE: "1"

on:
  workflow_dispatch:

jobs:
  ios-dev-ipa:
    name: iOS unsigned dev IPA
    runs-on: macos-26
    timeout-minutes: 180
    env:
      MAKEFLAGS: -j2
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      COMPILER_INDEX_STORE_ENABLE: "NO"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Restore CocoaPods download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('bun.lock', 'apps/mobile/modules/*/ios/*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/mobile
        run: bun run typecheck
      - name: Use the dev bundle id (CI checkout only, not committed)
        working-directory: apps/mobile
        run: |
          python3 -c "import json; p='app.json'; d=json.load(open(p)); d['expo']['ios']['bundleIdentifier']='pm.nemu.mihon.dev'; json.dump(d, open(p,'w'), indent=2, ensure_ascii=False); open(p,'a').write('\n')"
          grep -F '"bundleIdentifier": "pm.nemu.mihon.dev"' app.json
      - name: Generate iOS native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --no-install
      - name: Materialise manga OCR models
        # Release builds refuse to build without them (NemuJapaneseLearning
        # podspec), and `pod install` must see them to bundle them.
        # Same step upstream mobile.yml runs before pod install.
        working-directory: apps/mobile
        run: bun run ocr:models
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build iOS Release device app (unsigned)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace nemu.xcworkspace \
            -scheme nemu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/nemu-ios-derived-Release \
            -jobs 2 \
            -IDEBuildOperationMaxNumberOfConcurrentCompileTasks=2 \
            CODE_SIGNING_ALLOWED=NO \
            NEMU_ICHIRAN_KERNEL_OPTIONAL=1 \
            build
      - name: Package unsigned IPA
        run: |
          app="$(find /tmp/nemu-ios-derived-Release/Build/Products/Release-iphoneos -maxdepth 1 -name 'nemu.app' -print -quit)"
          test -n "$app" || { echo "nemu.app not found in DerivedData" >&2; exit 1; }
          rm -rf /tmp/nemu-ipa-payload && mkdir -p /tmp/nemu-ipa-payload/Payload
          cp -R "$app" /tmp/nemu-ipa-payload/Payload/
          cd /tmp/nemu-ipa-payload && zip -qr "$GITHUB_WORKSPACE/nemu-mihon-dev-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/nemu-mihon-dev-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/nemu-mihon-dev-unsigned.ipa" | head -5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemu-mihon-dev-unsigned-ipa
          path: nemu-mihon-dev-unsigned.ipa
          retention-days: 7
